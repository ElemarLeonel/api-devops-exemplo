services:
  api:
    image: ${IMAGE:?Defina IMAGE no .env}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-18473}:18473"
    volumes:
      - tasks-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18473/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  tasks-data:
